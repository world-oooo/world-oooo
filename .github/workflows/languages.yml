name: Generate language chart

# 공개 저장소의 언어 바이트를 합산해 막대그래프 SVG를 만든다.
# 서드파티 액션 없이 저장소 안의 스크립트만 쓴다 (.github/scripts/gen-languages.py).

on:
  schedule:
    - cron: "0 6 * * 1"     # 매주 월요일
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate language chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          OUTPUT: assets/languages.svg
        run: python3 .github/scripts/gen-languages.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages.svg
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "Regenerate language chart"
            git push
          fi
